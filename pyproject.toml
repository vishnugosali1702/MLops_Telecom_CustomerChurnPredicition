[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-cli"
version = "0.1.0"
description = "Simple CLI template for a production-style MLOps workflow"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mlops = "mlops_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
